[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
always_use_create_2_factory = true
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./script/env/tokens.json" },
  { access = "read-write", path = "./deploys/" },
]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false
show_metrics = true

[profile.lite.fuzz]
runs = 32

[profile.lite.invariant]
runs = 8
depth = 16

[profile.deep.fuzz]
runs = 5000

[profile.deep.invariant]
runs = 512
depth = 128

[fmt]
line_length = 120
quote_style = "single"
tab_width = 2

[lint]
exclude_lints = ["asm-keccak256"]
ignore = ["test/mocks/*.sol"]
