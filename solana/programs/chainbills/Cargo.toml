[package]
name = "chainbills"
version = "0.1.0"
description = "Cross-chain Crypto Payment Gateway powered by Wormhole + Circle CCTP"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chainbills"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
mainnet = []
# Skip external CCTP/Wormhole CPIs so LiteSVM unit tests can run without live
# programs. All state logic (PDAs, payload decode, replay protection) is still
# exercised. Gate every outbound/inbound CPI block with:
#   #[cfg(not(feature = "skip-external-cpi"))]
skip-external-cpi = []
# Feature flag to run litesvm integration tests (multi-instruction flows)
integration-tests = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Required by Anchor's #[program] macro to suppress cfg warnings
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = "allow"

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# Use default features (includes token, token_2022, associated_token, mint).
# Matching rebelorcs approach — avoids forcing specific sub-dep versions.
anchor-spl = "0.32.1"

[dev-dependencies]
# mollusk-svm: fast in-process SVM for unit tests + compute profiling.
# Matches the version used in rebelorcs companion project.
# NOTE: litesvm Rust crate cannot coexist with mollusk ~0.4 (solana-signature version conflict).
# Use litesvm via npm (`litesvm` package) for TypeScript tests only.
mollusk-svm = { version = "~0.4", features = ["all-builtins"] }
mollusk-svm-programs-token = "~0.4"
# Pin Solana crate versions to match rebelorcs known-good resolution
solana-account = "2.2.1"
solana-logger = "3.0.0"
solana-program = "2.3.0"
